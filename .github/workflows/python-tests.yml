name: Python Tests # Name of the workflow displayed on GitHub

on: # Events that trigger the workflow
  push:
    branches: [ "main", "master" ] # Run on pushes to main or master branches
  pull_request:
    branches: [ "main", "master" ] # Run on pull requests targeting main or master

jobs: # Define the jobs to run
  test: # ID of the job (can be anything descriptive)
    runs-on: ubuntu-latest # Use the latest Ubuntu runner provided by GitHub
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix: # Define a matrix to run tests on multiple Python versions
        python-version: [ "3.9", "3.10", "3.11", "3.12" ] # List Python versions you support

    steps: # Sequence of tasks within the job
      - name: Checkout repository # Step 1: Get the code from the repository
        uses: actions/checkout@v4 # Use the standard checkout action

      - name: Set up Python ${{ matrix.python-version }} # Step 2: Set up the specific Python version from the matrix
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Optional: Cache pip dependencies (uv might benefit indirectly or if setup-python uses pip)
          cache: 'pip'

      - name: Install uv # Step 3: Install uv using pip
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Create uv virtual environment # Step 4: Create a uv virtual environment
        run: python -m uv venv .venv

      - name: Activate uv virtual environment # Step 5: Activate the virtual environment
        shell: bash # Or appropriate shell for your runner
        run: source .venv/bin/activate

      # Optional: Cache uv dependencies (might speed up subsequent runs)
      # Note: Adjust the path based on where uv caches on the runner if needed.
      # ~/.cache/uv is a common location.
      - name: Cache uv dependencies # Step 6: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install project dependencies # Step 7: Install project + test dependencies using uv (in the venv)
        run: uv pip install -e ".[test]"

      - name: Run tests with pytest # Step 8: Execute pytest (in the venv)
        run: pytest # Or use 'python -m pytest' if preferred